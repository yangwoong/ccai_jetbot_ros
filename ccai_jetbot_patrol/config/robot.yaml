patrol_node:
  ros__parameters:
    linear_speed: 0.04
    angular_speed: 0.16
    heartbeat_seconds: 2.0
    safe_stop_on_idle: true
    patrol_forward_seconds: 4.0
    patrol_turn_seconds: 1.2
    use_vision_cmd_vel: true
    vision_command_timeout_seconds: 0.8
    manual_move_seconds: 1.5
    manual_turn_seconds: 0.8
    speed_step: 0.2
    min_speed_scale: 0.3
    max_speed_scale: 2.0
    speed_ramp_seconds: 1.5
    speed_ramp_min_factor: 0.35
    manual_drive_slow_factor: 0.5
    locations_file: "data/locations.json"
    explore_label_interval_seconds: 45.0
    explore_label_timeout_seconds: 120.0
    # true only once visual_odom_node is actually running (CCAI_ENABLE_VISUAL_ODOM=1) -
    # see docs/navigation_roadmap.md. Leave false for the default reactive
    # patrol (depth_nav_node driving EXPLORING directly).
    explore_frontier_mode: true
    odom_timeout_seconds: 2.0
    pose_goal_tolerance_m: 0.15
    pose_goal_timeout_seconds: 30.0
    heading_align_threshold_rad: 0.3
    explore_step_distance_m: 0.8
    explore_subgoal_timeout_seconds: 8.0
    explore_visited_cell_size_m: 0.5
    explore_candidate_count: 8
    # Room-scan explorer (2026-07-26) - takes priority over explore_frontier_mode
    # above when both are true. See patrol_node.py's tick_room_scan(). Time-based
    # rotation + VLM doorway detection, not visual_odom_node yaw-fed, so it's
    # usable even though that node's yaw tracking during rotation is unreliable
    # (see explore_subgoal_timeout_seconds' comment). Requires CCAI_ENABLE_EXPLORE_LLM=1
    # at launch (a second vlm_client_node instance watching the D435i) and
    # CCAI_ENABLE_DEPTH_NAV=1 (for that D435i color feed + obstacle safety checks).
    explore_room_scan_mode: true
    # Measured on real hardware (2026-07-27): explore_room_scan_angular_speed
    # 0.09 + explore_room_scan_turn_seconds 1.0 actually turns ~90 degrees per
    # step, not the originally intended 45 - rather than keep chasing an
    # exact 45-degree calibration (no wheel encoders, so this is trial and
    # error each time), accepted 90 degrees as this rig's real per-step
    # rotation and switched to 4 steps/sweep (360/90=4) to match, per user
    # instruction to keep the rotation as-is and fix the math around it
    # instead. If you re-tune the speed/duration below, re-derive this from
    # whatever the new real per-step angle turns out to be (360 / that angle).
    explore_room_scan_headings: 4
    explore_room_scan_angular_speed: 0.09
    explore_room_scan_turn_seconds: 1.0
    explore_room_scan_linear_speed: 0.03
    explore_room_scan_settle_seconds: 1.0
    explore_room_scan_vlm_timeout_seconds: 15.0
    explore_room_scan_advance_seconds: 4.0
    explore_graph_file: "data/room_graph.json"
    # "별도로 명령하지 않는 한 요청한 임무를 끝까지 수행해" - see
    # room_scan_begin_backtrack_or_finish's comment. Retries a shifted sweep
    # this many times at the root spot before actually declaring the
    # mission done, instead of stopping after the first empty sweep.
    explore_room_scan_max_root_retries: 3
    # "LLM이 적극 개입하여 자율탐색" - see room_scan_begin_obstacle_check's
    # declare_parameter comment. Before abandoning a direction the VLM
    # already judged movable, ask it to confirm from the close-up view
    # whether it's actually blocked or just narrow, this many times.
    explore_room_scan_max_obstacle_overrides: 2

visual_odom_node:
  ros__parameters:
    # true only alongside CCAI_ENABLE_VISUAL_ODOM=1 at launch (this alone
    # doesn't start the node - see launch/patrol.launch.py).
    enabled: true
    color_topic: "/camera/camera/color/image_raw"
    depth_topic: "/camera/camera/aligned_depth_to_color/image_raw"
    camera_info_topic: "/camera/camera/color/camera_info"
    depth_scale_to_meters: 0.001
    min_valid_depth_m: 0.2
    max_valid_depth_m: 4.0
    min_good_matches: 15
    max_reprojection_error_m: 0.15
    odom_frame: "odom"
    base_frame: "base_link"
    # ORB+Kabsch on every 30fps frame is too much CPU for a Jetson Nano
    # running the rest of the stack at the same time - process every 3rd
    # color frame (effectively ~10fps odometry) instead.
    process_every_n_frames: 3
    # Camera-optical-frame -> robot-planar-frame axis mapping is unverified
    # on real hardware - flip to -1.0 if motion comes out backwards/mirrored
    # once tested (see visual_odom_node.py's docstring).
    yaw_sign: 1.0
    lateral_sign: 1.0
    forward_sign: 1.0

jetbot_hardware_node:
  ros__parameters:
    enabled: true
    cmd_vel_topic: "/cmd_vel"
    motor_backend: "auto"
    motor_i2c_bus: -1
    motor_i2c_address: 0
    left_motor_channel: 1
    right_motor_channel: 2
    max_linear_speed: 0.05
    max_angular_speed: 0.22
    motor_output_scale: 0.35
    left_trim: -1.0
    right_trim: -1.0
    command_timeout_seconds: 1.0
    status_led_pin: -1
    status_led_active_high: true
    oled_enabled: true
    oled_bus: -1
    oled_refresh_seconds: 2.0

camera_node:
  ros__parameters:
    enabled: true
    camera_index: 0
    camera_device: ""
    camera_url: ""
    camera_url_timeout_seconds: 1.5
    camera_mode: "csi"
    camera_backend: "auto"
    use_gstreamer: true
    force_v4l2: true
    capture_width: 640
    capture_height: 480
    csi_sensor_id: 0
    csi_sensor_mode: 3
    csi_capture_width: 816
    csi_capture_height: 616
    csi_fps: 30
    csi_flip_method: 0
    width: 320
    height: 240
    fps: 10.0
    jpeg_quality: 45
    reopen_after_failures: 5
    capture_retry_seconds: 3.0
    max_open_attempts: 0
    open_probe_frames: 8
    reject_invalid_frames: true
    reject_invalid_on_open: false
    invalid_green_ratio: 0.85
    invalid_min_stddev: 8.0
    debug_frame_path: "/tmp/ccai_camera_last_invalid.jpg"
    output_topic: "/image_raw/compressed"

vision_nav_node:
  ros__parameters:
    enabled: true
    # false: D435i (depth_nav_node below) is connected and drives instead -
    # CSI stays on for YOLO/follow-person/debug overlay, it just stops
    # contributing patrol/manual-forward drive commands (its floor-obstacle
    # heuristics are meaningless pointed at a ceiling). See depth_nav_node's
    # docstring and docs/navigation_roadmap.md.
    drive_enabled: false
    image_topic: "/image_raw/compressed"
    linear_speed: 0.045
    turn_speed: 0.16
    follow_linear_speed: 0.04
    max_angular_speed: 0.22
    obstacle_stop_edge_density: 0.16
    min_valid_frame_seconds: 1.0
    person_detect_every_n_frames: 5
    follow_target_area: 0.18
    follow_min_area: 0.035
    yolo_model_path: "data/models/yolov8n.onnx"
    yolo_engine_path: "data/models/yolov8n.engine"
    yolo_input_size: 320
    yolo_confidence: 0.45
    yolo_nms_threshold: 0.45
    yolo_detect_every_n_frames: 3
    obstacle_box_min_area: 0.05
    obstacle_path_bottom_fraction: 0.5
    obstacle_trigger_min_interval_seconds: 4.0
    floor_color_diff_threshold: 130.0
    bottom_change_threshold: 35.0
    debug_image_enabled: true
    obstacle_avoidance_hold_seconds: 1.0
    obstacle_clear_confirm_frames: 5
    steer_direction_noise_floor: 0.01
    steer_smoothing_alpha: 0.4
    obstacle_avoidance_max_seconds: 6.0
    obstacle_turn_pulse_seconds: 0.3
    obstacle_pause_seconds: 0.2
    speed_ramp_seconds: 1.5
    speed_ramp_min_factor: 0.35
    camera_alert_min_interval_seconds: 10.0

depth_nav_node:
  ros__parameters:
    # true: D435i connected and driving patrol/manual-forward. Also requires
    # CCAI_ENABLE_DEPTH_NAV=1 at launch (see host_docker_run.sh/.env).
    enabled: true
    # Keep this in sync with patrol_node.explore_frontier_mode above - when
    # true, this node stops driving/competing during EXPLORING and only
    # reports obstacle_now (patrol_node's own controller drives instead).
    explore_frontier_mode: true
    depth_image_topic: "/camera/camera/depth/image_rect_raw"
    color_image_topic: "/camera/camera/color/image_raw"
    debug_image_enabled: true
    depth_scale_to_meters: 0.001
    min_valid_depth_m: 0.2
    max_valid_depth_m: 4.0
    linear_speed: 0.045
    turn_speed: 0.16
    max_angular_speed: 0.22
    # Raised from 0.45m (2026-07-27): no wheel encoders means stopping
    # distance after this triggers isn't precise, and this node's own
    # region_distance() bug (fixed same day - see depth_nav_node.py) let the
    # robot get close enough that depth readings went invalid and it kept
    # driving in. More margin here compensates for both.
    obstacle_stop_distance_m: 0.6
    min_valid_frame_seconds: 1.0
    obstacle_avoidance_hold_seconds: 1.0
    obstacle_clear_confirm_frames: 5
    obstacle_avoidance_max_seconds: 6.0
    obstacle_turn_pulse_seconds: 0.3
    obstacle_pause_seconds: 0.2
    steer_smoothing_alpha: 0.4
    speed_ramp_seconds: 1.5
    speed_ramp_min_factor: 0.35
    camera_alert_min_interval_seconds: 10.0

vlm_client_node:
  ros__parameters:
    api_base_url: ""
    api_key: ""
    model: ""
    image_topic: "/image_raw/compressed"
    trigger_topic: "/ccai/vlm_trigger"
    prompt: "You are monitoring a patrol robot's camera. Reply with exactly one line: start with 'RISK:' if you see something dangerous or unusual (person down, fire, smoke, collision risk, intruder, blocked path), otherwise start with 'NORMAL:'. Follow the prefix with a summary in Korean of 50 characters or fewer. No markdown, no extra lines."
    summary_max_chars: 50
    min_interval_seconds: 5.0
    request_timeout_seconds: 35.0
    error_event_min_interval_seconds: 30.0

# Second vlm_client_node instance (see launch/patrol.launch.py's
# CCAI_ENABLE_EXPLORE_LLM node, remapped to name "vlm_explore_node") - watches
# the D435i front-facing color feed instead of the CSI ceiling feed the main
# vlm_client_node above watches. api_base_url/api_key/model left empty so it
# falls back to the same CCAI_VLLM_* env vars as the main instance - same VLM
# endpoint, just a different camera and a much longer min_interval_seconds
# so it never fires on its own ambient timer, only when patrol_node's
# room-scan explorer explicitly triggers it with a question at each
# rotation step (see patrol_node.py's room_scan_request_vlm_step).
vlm_explore_node:
  ros__parameters:
    api_base_url: ""
    api_key: ""
    model: ""
    image_topic: "/camera/camera/color/image_raw/compressed"
    trigger_topic: "/ccai/vlm_explore_trigger"
    summary_max_chars: 60
    min_interval_seconds: 999999.0
    request_timeout_seconds: 35.0
    error_event_min_interval_seconds: 30.0

llm_control_node:
  ros__parameters:
    api_base_url: ""
    api_key: ""
    model: ""
    request_timeout_seconds: 20.0
    health_check_seconds: 30.0

web_chat_node:
  ros__parameters:
    host: "0.0.0.0"
    port: 8080

telegram_bridge_node:
  ros__parameters:
    bot_token: ""
    allowed_chat_id: ""
    poll_seconds: 2.0
    notify_startup: true
    max_backoff_seconds: 60.0

ota_agent_node:
  ros__parameters:
    manifest_url: ""
    current_version_file: "data/current_version.txt"
    check_interval_seconds: 300.0
    auto_apply: false
    workdir: "."
